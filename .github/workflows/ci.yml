name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Daily run of the live Global X invariants (the `live` job); push/PR CI stays offline.
  schedule:
    - cron: '17 6 * * *'
  # Allow release.yml to run this exact suite as a gating `uses:` job before it
  # publishes any binaries.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Include github.workflow so a direct CI run and the `uses:`-embedded CI job of
  # release.yml land in DISTINCT groups (in a reusable workflow github.workflow
  # resolves to the CALLER), so the release caller doesn't cancel an in-flight CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SQL test runner must speak the same VGI protocol as the community extension.
  HAYBARN_VERSION: "2.0.1rc3"

jobs:
  # bun test + own-source typecheck (shared reusable workflow).
  ci:
    uses: Query-farm/vgi-actions/.github/workflows/ts-ci.yml@main

  # SQLLogic (haybarn) E2E: test/sql/ through the published haybarn-unittest runner and
  # the signed community vgi extension, over every transport (ci/run-integration.sh, as in
  # the vgi-starter template). Offline: bind-time schema asserts
  # only; the live-invariant files (require-env GLOBALX_LIVE) run in the `live` job.
  e2e:
    name: SQLLogic e2e (haybarn, ${{ matrix.transport }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        transport: [stdio, launch, http]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - name: Install worker dependencies
        run: bun install --frozen-lockfile
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        env:
          WORKER: ${{ github.workspace }}/bin/vgi-etf-globalx-worker
          HAYBARN_UNITTEST: ${{ github.workspace }}/.tools/bin/haybarn-unittest
          TRANSPORT: ${{ matrix.transport }}
          # The *_live.test files need GLOBALX_LIVE (the `live` job); here they skip.
          EXPECTED_SKIP_REASONS: "require-env GLOBALX_LIVE"
        run: ci/run-integration.sh

  # Live invariants against Global X (rate-limits shared runner IPs at times), kept out
  # of push/PR CI so it stays deterministic: daily schedule or a manual dispatch only.
  live:
    name: SQLLogic live (Global X)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - name: Install worker dependencies
        run: bun install --frozen-lockfile
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql including the live invariants
        env:
          WORKER: ${{ github.workspace }}/bin/vgi-etf-globalx-worker
          HAYBARN_UNITTEST: ${{ github.workspace }}/.tools/bin/haybarn-unittest
          TRANSPORT: stdio
          GLOBALX_LIVE: "1"
        run: ci/run-integration.sh

  # Metadata-quality gate (vgi-lint): scores the worker's catalog/schema/function docs,
  # tags, categories, per-arg docs, and examples. execute:false keeps it deterministic —
  # the live-network behavior is covered by the e2e jobs, not here. fail-on info = strict.
  lint:
    name: metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install worker dependencies
        run: bun install --frozen-lockfile
      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          # @v2 = vgi-lint-check 2.x on haybarn 2.0 (vgi.v3); no finer pin, so the latest 2.x release lints.
          location: "${{ github.workspace }}/bin/vgi-etf-globalx-worker"
          fail-on: info
          execute: "false"
